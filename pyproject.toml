[project]
name = "scraper-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benny Wambua", email = "wambuabeny69@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "arq>=0.28.0",
    "crawl4ai>=0.9.4",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "redis>=5.3.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
scraper-engine = "scraper_engine:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
